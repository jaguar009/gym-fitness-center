# Perfil preparado para la nube: exige variables reales de la instancia Azure.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.connection-timeout=90000
spring.datasource.hikari.initialization-fail-timeout=180000
spring.jpa.hibernate.ddl-auto=validate
spring.thymeleaf.cache=true
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD}
app.bootstrap.reception-password=${APP_RECEPTION_PASSWORD}
