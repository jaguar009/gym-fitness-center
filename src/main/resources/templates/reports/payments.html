<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Reporte de pagos')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-3"><div><p class="eyebrow">CONSULTA 02</p><h1>Reporte de pagos</h1></div><a class="btn btn-outline-primary" th:href="@{/reports/payments/pdf(from=${from},to=${to},method=${method})}">Descargar PDF</a></div><form class="filter-bar row g-2 mb-3" method="get" th:action="@{/reports/payments}"><div class="col-md-4"><label class="form-label">Desde</label><input class="form-control" type="date" name="from" th:value="${from}"></div><div class="col-md-4"><label class="form-label">Hasta</label><input class="form-control" type="date" name="to" th:value="${to}"></div><div class="col-md-2"><label class="form-label">Método</label><select class="form-select" name="method"><option value="">Todos</option><option value="EFECTIVO" th:selected="${method == 'EFECTIVO'}">Efectivo</option><option value="YAPE" th:selected="${method == 'YAPE'}">Yape</option><option value="TARJETA" th:selected="${method == 'TARJETA'}">Tarjeta</option><option value="TRANSFERENCIA" th:selected="${method == 'TRANSFERENCIA'}">Transferencia</option></select></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-outline-primary w-100">Consultar</button></div></form><div class="table-responsive"><table class="table"><thead><tr><th>Fecha</th><th>Miembro</th><th>Monto</th><th>Método</th><th>Concepto</th></tr></thead><tbody><tr th:each="row : ${rows}"><td th:text="${row.fechaPago}"></td><td th:text="${row.member.nombres + ' ' + row.member.apellidos}"></td><td th:text="${row.monto}"></td><td th:text="${row.metodoPago}"></td><td th:text="${row.concepto}"></td></tr><tr th:if="${#lists.isEmpty(rows)}"><td colspan="5" class="text-center py-4 text-muted">Sin resultados.</td></tr></tbody></table></div></main></body></html>
