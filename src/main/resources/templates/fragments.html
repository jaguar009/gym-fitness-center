<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Gym Fitness Center'">Gym Fitness Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css(v=20260912-performance)}">
</head>
<body>
<nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <script defer th:src="@{/js/app.js(v=20260912)}"></script>
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}"><span class="brand-mark" aria-hidden="true">GF</span><span>Gym Fitness<br> Center</span></a>
        <button class="navbar-toggler" type="button" aria-controls="mainNav" aria-expanded="false" aria-label="Abrir navegación"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Resumen</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/members}">Miembros</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/memberships}">Membresías</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/payments}">Pagos</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/attendance}">Asistencia</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/classes}">Clases</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/reports}">Reportes</a></li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')"><a class="nav-link" th:href="@{/employees}">Empleados</a></li>
            </ul>
            <span class="navbar-text me-3" sec:authentication="name"></span>
            <form th:action="@{/logout}" method="post"><button class="btn btn-outline-light btn-sm">Salir</button></form>
        </div>
    </div>
</nav>
</body>
</html>
