<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Inscripción a clase')}"></head>
<body><div th:replace="~{fragments :: nav}"></div><main class="container py-4 narrow"><p class="eyebrow">CASO TRANSACCIONAL</p><h1>Inscribir miembro</h1><p class="text-muted">Clase: <b th:text="${gymClass.nombre}"></b> · Cupos disponibles: <b th:text="${gymClass.cupos}"></b></p><form class="form-card mt-4" th:action="@{/classes/{id}/enroll(id=${gymClass.id})}" method="post"><label class="form-label">Miembro activo</label><select class="form-select" name="memberId" required><option value="">Seleccionar</option><option th:each="member : ${members}" th:if="${member.estado == 'ACTIVO'}" th:value="${member.id}" th:text="${member.nombres + ' ' + member.apellidos}"></option></select><div class="mt-4"><button class="btn btn-primary">Registrar inscripción</button> <a class="btn btn-link" th:href="@{/classes}">Cancelar</a></div></form></main></body></html>
