name: Build and deploy Gym Fitness Center

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B clean package -Dmaven.test.skip=true
      - name: Save executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-fitness-center-java21
          path: target/gym-fitness-center-1.0.0.jar
  deploy:
    needs: build
    if: ${{ github.event_name != 'pull_request' && vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_CLIENT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: gym-fitness-center-java21
      - name: Sign in with federated deployment identity
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: gym-fitness-center-1.0.0.jar
      - name: Deployment summary
        run: echo '### Despliegue Azure ejecutado con OIDC. Este workflow compila y publica; no ejecuta pruebas funcionales.' >> "$GITHUB_STEP_SUMMARY"
